name: Claude Code (Gitea)

# Tag mode: Claude responds to @claude mentions in issues and PRs.
# Requires Gitea >= 1.19 with Actions enabled and a registered act_runner.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Clone Claude Code Action
        run: |
          git clone --depth 1 https://github.com/anthropics/claude-code-action.git "${{ runner.temp }}/claude-code-action"
          cd "${{ runner.temp }}/claude-code-action"
          bun install --production

      - name: Run Claude Code
        run: bun run "${{ runner.temp }}/claude-code-action/src/entrypoints/run-gitea.ts"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_API_URL: ${{ vars.GITEA_API_URL }} # e.g. https://your-gitea.example.com/api/v1
          GITEA_SERVER_URL: ${{ vars.GITEA_SERVER_URL }} # e.g. https://your-gitea.example.com
          TRIGGER_PHRASE: "@claude"

          # Optional: Trigger when specific user is assigned to an issue
          # ASSIGNEE_TRIGGER: "claude-bot"
