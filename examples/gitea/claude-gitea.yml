name: Claude Code (Gitea)

# Tag mode: Claude responds to @claude mentions in issues and PRs.
# Requires Gitea >= 1.19 with Actions enabled and a registered act_runner.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 一个 step 完成所有操作：安装 bun → clone 仓库 → 安装依赖 → 运行
      - name: Run Claude Code Action (Gitea)
        run: |
          set -e

          # 1. Install Bun
          echo "=== Installing Bun ==="
          curl -fsSL https://bun.sh/install | bash
          export BUN_PATH="$HOME/.bun/bin"
          export PATH="$BUN_PATH:$PATH"
          echo "Bun version: $(bun --version)"

          # 2. Clone claude-code-action
          echo "=== Cloning claude-code-action ==="
          CCA_DIR="$HOME/cca"
          git clone --depth 1 https://github.com/hooxing/claude-code-action "$CCA_DIR"
          echo "Cloned to: $CCA_DIR"

          # 关键：设置 GITHUB_ACTION_PATH 为实际 clone 路径
          export GITHUB_ACTION_PATH="$CCA_DIR"
          echo "GITHUB_ACTION_PATH=$GITHUB_ACTION_PATH"

          # 3. Install dependencies
          echo "=== Installing dependencies ==="
          cd "$CCA_DIR"
          bun install --production

          # 4. Run
          echo "=== Running Claude Code Action ==="
          cd "$GITHUB_WORKSPACE"
          bun run "$CCA_DIR/src/entrypoints/run-gitea.ts"
        env:
          # Gitea API 地址（根据你的环境修改）
          GITEA_API_URL: http://gitea:3000/api/v1
          GITEA_SERVER_URL: http://gitea:3000

          # 身份认证
          GITEA_TOKEN: ${{ secrets.CLAUDE_PAT }}
          OVERRIDE_GITHUB_TOKEN: ${{ secrets.CLAUDE_PAT }}

          # 触发配置
          TRIGGER_PHRASE: "@claude"
          LABEL_TRIGGER: "claude"
          ASSIGNEE_TRIGGER: ""
          TRACK_PROGRESS: "true"

          # 机器人身份
          BOT_NAME: "claude-bot"
          BOT_ID: "0"

          # 分支设置
          BRANCH_PREFIX: "claude/"
          BRANCH_NAME_TEMPLATE: ""
          BASE_BRANCH: ""

          # 评论/过滤设置
          USE_STICKY_COMMENT: "false"
          INCLUDE_FIX_LINKS: "true"
          ALLOWED_BOTS: ""
          ALLOWED_NON_WRITE_USERS: ""
          INCLUDE_COMMENTS_BY_ACTOR: ""
          EXCLUDE_COMMENTS_BY_ACTOR: ""

          # Claude CLI 参数
          CLAUDE_ARGS: ""
          PROMPT: ""

          # Base-action 必需输入
          INPUT_PROMPT_FILE: /tmp/claude-prompts/claude-prompt.txt
          INPUT_SETTINGS: ""
          INPUT_SHOW_FULL_OUTPUT: "false"
          DISPLAY_REPORT: "true"
          INPUT_PLUGINS: ""
          INPUT_PLUGIN_MARKETPLACES: ""
          PATH_TO_CLAUDE_CODE_EXECUTABLE: ""
          INPUT_PATH_TO_CLAUDE_CODE_EXECUTABLE: ""
          INPUT_PATH_TO_BUN_EXECUTABLE: ""

          # Anthropic API
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}

